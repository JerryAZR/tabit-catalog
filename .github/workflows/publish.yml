# The publishing flow: wrap the generator CLI (PROVIDERS.md's
# channel). Runs on overlay/code changes (push to main), daily at
# 03:17 UTC (an off-round minute — scheduler herds cluster at :00;
# and it lands 11:17 Beijing, so a failure surfaces in the owner's
# morning), and manually via workflow_dispatch.
#
# The channel lives on the dedicated `catalog` branch: the default
# list at the root plus the variant lists in subdirectories (cn,
# global, openrouter) — each directory is an independent channel
# (the client concatenates {base}/latest.toml and
# {base}/catalog-<version>.toml, so a subdirectory is just another
# base). `latest.toml` (the mutable pointer) plus the immutable,
# cache-forever `catalog-<version>.toml` files accumulate — they
# must never disappear (clients checksum them by URL).
#
# Mirrors (the coordinates tabit's built-in `catalog.urls` default
# consumes): jsDelivr first (reliable from China), GitHub raw second.
#   https://cdn.jsdelivr.net/gh/JerryAZR/tabit-catalog@catalog
#   https://raw.githubusercontent.com/JerryAZR/tabit-catalog/catalog

name: publish

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test

      - name: Generate
        run: |
          cargo run --release -- generate --overlay overlays/default.toml  --out dist
          cargo run --release -- generate --overlay overlays/cn.toml        --out dist/cn
          cargo run --release -- generate --overlay overlays/global.toml    --out dist/global
          cargo run --release -- generate --overlay overlays/openrouter.toml --out dist/openrouter

      - name: Publish to the catalog branch
        run: |
          set -euo pipefail

          remote_branch=false
          if git fetch origin catalog --depth=1 2>/dev/null; then remote_branch=true; fi

          if $remote_branch; then
            git worktree add -B catalog deploy FETCH_HEAD
          else
            git worktree add --orphan -b catalog deploy
          fi
          cp -r dist/. deploy/
          cd deploy
          git config user.name "tabit-catalog publisher"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          # Idempotence guard: nothing changed across any list — a
          # no-op (no version churn on content-identical days).
          if git diff --cached --quiet; then
            version=$(sed -n 's/^version = "\(.*\)"$/\1/p' latest.toml)
            echo "::notice::$version: every list already current — nothing to do"
            exit 0
          fi
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' latest.toml)
          git commit -qm "publish $version (+ variants)"
          git push origin catalog
          echo "::notice::published $version (+ variants)"
