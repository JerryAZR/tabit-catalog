# The global list: the global coding/token plans plus the western
# providers. Same mechanism as the default list (README: variant
# lists).

[providers.kimi-code-plan-global]
api = "anthropic-messages"
base_url = "https://api.kimi.ai/coding"
api_key_env = "KIMI_CODE_PLAN_GLOBAL_API_KEY"
note = "global mirror of the cn endpoint structure"

[providers.zai-coding-plan]
api = "anthropic-messages"
base_url = "https://api.z.ai/api/anthropic"
api_key_env = "ZAI_CODING_PLAN_GLOBAL_API_KEY"
note = "the intl coding plan rides the same anthropic surface as payg; verified via ZCode"

[providers.minimax-coding-plan]
api = "anthropic-messages"
base_url = "https://api.minimax.io/anthropic"
api_key_env = "MINIMAX_CODING_PLAN_API_KEY"

[providers.alibaba-token-plan]
api = "anthropic-messages"
base_url = "https://token-plan.ap-southeast-1.maas.aliyuncs.com/apps/anthropic"
note = "global mirror of the cn endpoint structure"

[providers.anthropic]
api = "anthropic-messages"
base_url = "https://api.anthropic.com"

[providers.openai]
api = "openai-responses"
base_url = "https://api.openai.com/v1"

[providers.google]
api = "openai-completions"
base_url = "https://generativelanguage.googleapis.com/v1beta/openai"
api_key_env = "GEMINI_API_KEY"
note = "OpenAI-compat surface; the anthropic-compat endpoint is unverified — revisit"

[providers.deepseek]
api = "anthropic-messages"
base_url = "https://api.deepseek.com/anthropic"
note = "verified via ZCode's builtin provider config"

[providers.fireworks-ai]
api = "anthropic-messages"
base_url = "https://api.fireworks.ai/inference"
note = "verified via pi's provider data (the Messages surface)"

[providers.xai]
api = "openai-completions"
base_url = "https://api.x.ai/v1"

[providers.mistral]
api = "openai-completions"
base_url = "https://api.mistral.ai/v1"

[providers.groq]
api = "openai-completions"
base_url = "https://api.groq.com/openai/v1"

[providers.cerebras]
api = "openai-completions"
base_url = "https://api.cerebras.ai/v1"

[providers.togetherai]
api = "openai-completions"
base_url = "https://api.together.xyz/v1"
